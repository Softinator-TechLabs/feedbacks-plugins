name: Verify canonical packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Verify released ZIPs, manifests, catalog paths and complete file inventory
        run: python3 scripts/sync-plugins.py check
      - name: Check bundled JavaScript syntax
        run: |
          node --check codex/feedbacks/mcp.mjs
          node --check claude/feedbacks/mcp.mjs
          node --check codex/feedbacks/install-skill.mjs
          node --check claude/feedbacks/install-skill.mjs
